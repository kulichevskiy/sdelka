name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backend:
    name: Бэкенд · pytest + ruff
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: crm
          POSTGRES_PASSWORD: crm
          POSTGRES_DB: crm_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U crm -d crm_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run pytest -q
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://crm:crm@localhost:5432/crm_test

  frontend:
    name: Фронтенд · tsc + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

  deploy:
    name: Деплой на VPS
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://sdelka.app
    steps:
      - name: SSH-ключ
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      - name: git pull && docker compose up
        run: |
          ssh root@${{ secrets.SSH_HOST }} bash -s <<'REMOTE'
            set -euo pipefail
            cd /opt/sdelka
            git fetch -q origin main
            git reset -q --hard origin/main
            docker compose up -d --build --remove-orphans
            docker image prune -f >/dev/null
          REMOTE
      - name: Проверка /api/health
        run: |
          for i in $(seq 1 30); do
            code=$(ssh root@${{ secrets.SSH_HOST }} 'cd /opt/sdelka && docker compose exec -T api python -c "import urllib.request;print(urllib.request.urlopen(\"http://localhost:8000/api/health\").status)"' 2>/dev/null || true)
            [ "$code" = "200" ] && echo "ok" && exit 0
            sleep 2
          done
          echo "health check failed: $code"
          ssh root@${{ secrets.SSH_HOST }} 'cd /opt/sdelka && docker compose logs --tail 50 api'
          exit 1
